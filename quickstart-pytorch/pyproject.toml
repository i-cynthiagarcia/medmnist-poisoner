
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.6"
description = "OrganAMNIST Clean Federated Learning Baseline"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.30.0,<1.31.0",
    "torch>=2.0.0",
    "torchvision",
    "medmnist",
    "numpy",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["pytorchexample"]

[tool.flwr.app]
publisher = "group2"
fab-format-version = 1
flwr-version-target = "1.30.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 0.0
local-epochs = 1
learning-rate = 0.001
batch-size = 32
save-model = true


